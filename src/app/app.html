@if (updateAvailable()) {
  <div class="update-bar" role="status">
    <span>{{ 'app.updateAvailable' | translate }}</span>
    <button type="button" class="qm-btn qm-btn-gold qm-btn-sm" (click)="reload()">{{ 'app.refresh' | translate }}</button>
  </div>
}
@if (isLoading()) {
  <app-loading />
} @else {
  <router-outlet />
}
<app-toast-container />
