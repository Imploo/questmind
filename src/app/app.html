@if (updateAvailable()) {
  <div class="update-bar" role="status">
    <span>A new version of the app is available.</span>
    <button type="button" class="qm-btn qm-btn-gold qm-btn-sm" (click)="reload()">Refresh</button>
  </div>
}
@if (isLoading()) {
  <app-loading />
} @else {
  <router-outlet />
}
<app-toast-container />
